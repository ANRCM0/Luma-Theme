name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Verify build output
        run: |
          test -s dist/index.html
          test -d dist/assets
          find dist/assets -name '*.js' -size +0c | grep -q .
      - name: Install Playwright Chromium
        if: matrix.node == '22'
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        if: matrix.node == '22'
        run: npm run test:e2e
      - name: Build live TXBoard theme bundle
        run: npm run build
        env:
          TXBOARD_THEME: 'true'
          TXBOARD_THEME_PREVIEW: 'true'
      - name: Real-mode browser smoke tests (mocked API)
        if: matrix.node == '22'
        run: npm run test:live
      - name: Upload Playwright report on failure
        if: failure() && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload production build
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: viaspeed-theme-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
