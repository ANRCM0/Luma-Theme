name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # TEMPORARY branch-local packaging sync; reverted after generated assets committed

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Verify build output
        run: |
          test -s dist/index.html
          test -d dist/assets
          find dist/assets -name '*.js' -size +0c | grep -q .
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Build installable TXBoard theme assets
        run: npm run build
        env:
          TXBOARD_THEME: 'true'
      # WHY THIS STEP EXISTS: dist/ is gitignored, but its derived artifacts
      # (theme-package/dashboard.blade.php, config.json and assets/) are
      # COMMITTED. Vite content-hashes change on any source edit, so a commit
      # that forgets to re-run the packaging script leaves HEAD referencing an
      # asset hash that is not in the tree, and guests would load a 404 bundle.
      # The release workflow only runs on tags, so this is the only gate that
      # can catch the drift before it is published. Run the identical check
      # locally with `npm run check:theme-package`.
      - name: Stage and validate theme settings manifest
        run: |
          # THEME_VERSION must match the version already committed, otherwise
          # config.json would differ on every run for reasons unrelated to
          # asset drift. The tag release re-derives it from the tag instead.
          export THEME_VERSION="$(node -p "require('./theme-package/config.json').version")"
          echo "Verifying committed theme package for version $THEME_VERSION"
          node scripts/package-txboard.mjs
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("theme-package/config.json", "utf8"));
            const names = new Set(config.configs.map(field => field.field_name));
            for (const key of ["ui_density","ui_card_radius","page_shop_visible","shop_section_order","subscription_qr_visible","node_rate_visible"]) {
              if (!names.has(key)) throw Error("Missing atomic theme field: " + key);
            }
            if (config.name !== "vv-theme") throw Error("Theme identifier changed unexpectedly");
            if (names.size !== config.configs.length) throw Error("Duplicate theme setting name");
          '
      # One-time branch-local sync: the hash-addressed theme-package assets
      # must be generated with Node 22, not hand-edited. Revert after it lands.
      - name: Temporary sync generated TXBoard assets
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/txapi-native-finalize-20261011'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- theme-package/
          if ! git diff --cached --quiet; then
            git commit -m "build(theme): sync generated TXBoard theme assets"
            git push origin HEAD:refs/heads/fix/txapi-native-finalize-20261011
          fi
      - name: Fail if committed derived artifacts are stale
        shell: bash
        run: |
          if ! git diff --exit-code -- theme-package/; then
            echo "::error::Committed theme-package/ is stale. Run 'npm run check:theme-package' locally and commit the regenerated dashboard.blade.php, config.json and assets/."
            git --no-pager diff --stat -- theme-package/
            exit 1
          fi
          echo "Committed theme package matches a fresh build."
      - name: Build live TXBoard theme bundle
        run: npm run build
        env:
          TXBOARD_THEME: 'true'
          TXBOARD_THEME_PREVIEW: 'true'
      - name: Real-mode browser smoke tests (mocked API)
        run: npm run test:live
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: viaspeed-theme-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
