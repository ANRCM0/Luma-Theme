name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Verify build output
        run: |
          test -s dist/index.html
          test -d dist/assets
          find dist/assets -name '*.js' -size +0c | grep -q .
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Build live TXBoard theme bundle
        run: npm run build
        env:
          TXBOARD_THEME: 'true'
          TXBOARD_THEME_PREVIEW: 'true'
      - name: Stage and validate theme settings manifest
        run: |
          node scripts/package-txboard.mjs
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("theme-package/config.json", "utf8"));
            const names = new Set(config.configs.map(field => field.field_name));
            for (const key of ["ui_density","ui_card_radius","page_shop_visible","shop_section_order","subscription_qr_visible","node_rate_visible"]) {
              if (!names.has(key)) throw Error("Missing atomic theme field: " + key);
            }
            if (config.name !== "vv-theme") throw Error("Theme identifier changed unexpectedly");
            if (names.size !== config.configs.length) throw Error("Duplicate theme setting name");
          '
      - name: Real-mode browser smoke tests (mocked API)
        run: npm run test:live
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: viaspeed-theme-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
