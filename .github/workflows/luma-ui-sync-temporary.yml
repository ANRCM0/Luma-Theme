name: Temporary Luma UI bundle synchronization
on:
  push:
    branches:
      - 'style/luma-visual-quality-pass1-20261011'

permissions:
  contents: write

jobs:
  sync-ui-package:
    if: github.repository == 'ANRCM0/Luma-Theme' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build installable theme resources
        env:
          TXBOARD_THEME: 'true'
        run: npm run build
      - name: Regenerate theme-package with existing committed manifest version
        shell: bash
        run: |
          export THEME_VERSION="$(node -p "require('./theme-package/config.json').version")"
          node scripts/package-txboard.mjs
      - name: Commit changed hashed assets to feature branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-package/
          if git diff --cached --quiet; then
            echo "Bundle already synchronized."
            exit 0
          fi
          git commit -m "build(theme): sync UI assets for contrast and mobile touch pass"
          git push origin "HEAD:$GITHUB_REF_NAME"
