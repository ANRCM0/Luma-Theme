name: Temporary Layout Final Artifact Sync
on:
  push:
    branches:
      - 'style/luma-responsive-layout-pass2-20261011'

permissions:
  contents: write

jobs:
  sync-assets:
    if: github.repository == 'ANRCM0/Luma-Theme' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build TXBoard assets
        env:
          TXBOARD_THEME: 'true'
        run: npm run build
      - name: Package build
        run: |
          export THEME_VERSION="$(node -p "require('./theme-package/config.json').version")"
          node scripts/package-txboard.mjs
      - name: Commit assets to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-package/
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "build(theme): sync final responsive UI assets"
          git push origin "HEAD:$GITHUB_REF_NAME"
