name: Build TXBoard Theme Package
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build TXBoard assets
        run: npm run build
        env:
          TXBOARD_THEME: 'true'
      - name: Stage Theme Package v1
        run: node scripts/package-txboard.mjs
        env:
          THEME_VERSION: '0.5.0'
      - name: Create installable ZIP
        run: cd theme-package && zip -qr ../vv-theme-txboard.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: vv-theme-txboard
          path: vv-theme-txboard.zip
